name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        run: |
          php -l src/WechatServiceProvider.php
          php -l src/Packages/MiniProgram.php
          php -l src/Services/MiniProgramService.php
          php -l src/Facades/MiniProgram.php
          php -l src/Http/Controllers/MiniProgramController.php
          php -l config/wechat.php
